<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コピペ一覧</title>
<style>
:root{
  --bg:#f3f5f7;--panel:#fff;--ink:#1d2733;--sub:#6b7785;--line:#dbe1e7;
  --accent:#1f6f8b;--accent-ink:#fff;--ok:#2e8b57;--hover:#eef5f8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191e;--panel:#1c232a;--ink:#e6ebf0;--sub:#8d9aa7;--line:#2e3943;--accent:#4fb0cf;--accent-ink:#0d1a20;--ok:#5cc48a;--hover:#222c34;}}
:root[data-theme="dark"]{--bg:#14191e;--panel:#1c232a;--ink:#e6ebf0;--sub:#8d9aa7;--line:#2e3943;--accent:#4fb0cf;--accent-ink:#0d1a20;--ok:#5cc48a;--hover:#222c34;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.25rem;margin:0 0 4px}
.lead{color:var(--sub);font-size:.85rem;margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{font:inherit;font-size:.85rem;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#drop{border:2px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:.8rem;color:var(--sub);margin-bottom:12px;transition:.15s}
#drop.over{border-color:var(--accent);background:var(--hover)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;color:var(--sub);font-weight:600;background:var(--hover)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
td.item{width:34%;font-weight:600;word-break:break-word}
.val{display:flex;align-items:center;gap:10px;justify-content:space-between}
.val span{word-break:break-all;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:.88rem}
.copy{flex:none;font:inherit;font-size:.78rem;padding:4px 12px;border-radius:5px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;min-width:72px}
.copy:hover{background:var(--accent);color:var(--accent-ink)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.msg{font-size:.8rem;color:var(--sub);margin-top:10px;min-height:1.2em}
details{margin-top:16px;font-size:.8rem;color:var(--sub)}
textarea{width:100%;height:110px;margin-top:8px;font:inherit;font-size:.82rem;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>コピペ一覧</h1>
  <p class="lead">カンマ区切りのテキストファイル(1行目から「項目,値」)を読み込みます。最大20行。読み込んだ内容はこのブラウザに保存されます。</p>

  <div class="bar">
    <button class="btn primary" id="pick">テキストファイルを選ぶ</button>
    <button class="btn" id="export">テキストファイルに出力</button>
    <button class="btn" id="clear">保存データを削除</button>
    <input type="file" id="file" accept=".txt,.csv,text/plain,text/csv" hidden>
  </div>
  <div id="drop">ここにファイルをドラッグ&ドロップしても読み込めます</div>

  <div class="wrap">
    <table>
      <thead><tr><th>項目</th><th>値</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <details>
    <summary>テキストを直接貼り付けて表示</summary>
    <textarea id="ta" placeholder="氏名,山田 太郎&#10;メール,taro@example.com"></textarea>
    <button class="btn" id="apply" style="margin-top:6px">表示する</button>
    <button class="btn" id="taclear" style="margin-top:6px">入力欄をクリア</button>
  </details>
</main>

<script>
const MAX = 20;
const KEY = 'copyListData_v1';
function store(t){ try { localStorage.setItem(KEY, t); } catch(e){ msg.textContent += '(保存できませんでした)'; } }
function load(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
function wipe(){ try { localStorage.removeItem(KEY); } catch(e){} }

const $ = id => document.getElementById(id);
const body = $('body'), msg = $('msg');
let current = [];

// 1行を「最初のカンマ」で項目と値に分割(値の中のカンマは保持)
function parse(text){
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  const rows = [];
  for (const l of lines){
    const i = l.indexOf(',');
    rows.push(i < 0 ? [l.trim(), ''] : [l.slice(0,i).trim(), l.slice(i+1).trim()]);
  }
  return rows;
}

function render(text, save){
  const all = parse(text);
  const rows = all.slice(0, MAX);
  current = rows;
  body.replaceChildren();
  rows.forEach(([k, v]) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.className = 'item'; td1.textContent = k;
    const td2 = document.createElement('td');
    const box = document.createElement('div'); box.className = 'val';
    const s = document.createElement('span'); s.textContent = v;
    const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'コピー';
    b.setAttribute('aria-label', k + 'の値をコピー');
    b.addEventListener('click', () => copy(v, b));
    box.append(s, b); td2.append(box);
    tr.append(td1, td2); body.append(tr);
  });
  if (save && rows.length) store(text);
  msg.textContent = rows.length
    ? rows.length + '行を表示しました。' + (all.length > MAX ? '(' + MAX + '行を超えた分は省略)' : '')
      + (save ? ' このブラウザに保存しました。次回から自動で表示されます。' : '')
    : '表示できる行がありません。';
}

async function copy(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if (!ok){ // フォールバック
    const t = document.createElement('textarea');
    t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    t.remove();
  }
  const old = 'コピー';
  btn.textContent = ok ? 'コピー済み' : '失敗';
  btn.classList.toggle('done', ok);
  setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1400);
}

function exportText(){
  if (!current.length){ msg.textContent = '出力するデータがありません。'; return; }
  const text = current.map(([k, v]) => k + ',' + v).join('\r\n') + '\r\n';
  const blob = new Blob(['\uFEFF' + text], {type: 'text/plain;charset=utf-8'});
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const name = 'copylist_' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.txt';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  msg.textContent = current.length + '行を「' + name + '」として出力しました。';
}

function readFile(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = () => render(r.result, true);
  r.readAsText(f, 'UTF-8'); // Shift_JISの場合は下の注記参照
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => readFile(e.target.files[0]);
$('apply').onclick = () => render($('ta').value, true);
$('taclear').onclick = () => { $('ta').value = ''; $('ta').focus(); };
$('export').onclick = exportText;
$('clear').onclick = () => { wipe(); current = []; body.replaceChildren(); msg.textContent = '保存データを削除しました。'; };

const drop = $('drop');
['dragenter','dragover'].forEach(n => drop.addEventListener(n, e => {e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(n => drop.addEventListener(n, e => {e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));

const saved = load();
if (saved) { render(saved); msg.textContent = '保存済みのデータを表示しています。(' + msg.textContent + ')'; }
else msg.textContent = 'データがありません。テキストファイルを読み込んでください。';
</script>
</body>
</html>
